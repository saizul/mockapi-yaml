name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          mockapi --version
          mockapi -c examples/mock.yaml check

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mockapi-yaml:ci .
      - run: docker run --rm mockapi-yaml:ci --version
      - name: Start the container and call the example API
        run: |
          docker run -d --name mockapi -p 4010:4010 mockapi-yaml:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4010/__mockapi/health; then
              curl -fsS "http://127.0.0.1:4010/api/users?per_page=2"
              curl -fsS http://127.0.0.1:4010/api/orders/42
              exit 0
            fi
            sleep 1
          done
          docker logs mockapi
          exit 1

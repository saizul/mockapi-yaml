# A tour of mockapi-yaml. Run it with:
#   mockapi -c examples/mock.yaml serve
# then open http://127.0.0.1:4010/__mockapi/routes to see everything it serves.

settings:
  base_path: /api          # every mock below lives under /api
  latency: "40-120"        # random delay per request, in milliseconds
  error_rate: 0            # set to 0.1 to make 10% of requests fail
  error:
    status: 503
    body: { error: "Service temporarily unavailable" }
  seed: 42                 # reproducible fake data; remove for new values on each start
  cors: true               # or a list such as ["http://localhost:5173"]
  headers:
    X-Mock: "true"

# Full CRUD with filtering, sorting and pagination:
#   GET /api/users?role=admin&sort=-created_at&page=2&per_page=10
resources:
  users:
    generate:
      count: 50
      item:
        name: "{{faker.name}}"
        email: "{{faker.email}}"
        role: "{{faker.pick('admin', 'editor', 'viewer')}}"
        city: "{{faker.city}}"
        active: "{{faker.bool(0.8)}}"
        created_at: "{{faker.past_date(400)}}"
  todos:
    seed: data/todos.json
  products:
    envelope: true         # { data: [...], meta: { total, page, per_page, pages } }
    per_page: 12
    generate:
      count: 40
      item:
        sku: "SKU-{{index}}"
        title: "{{faker.words(2) | upper}}"
        price: "{{faker.price(5, 250)}}"
        in_stock: "{{faker.bool}}"

routes:
  - name: current user
    method: GET
    path: /me
    body:
      id: 1
      name: "{{faker.name}}"
      avatar: "{{faker.image_url(128, 128)}}"
      plan: pro

  # The first matching route wins, so specific variants go first.
  - name: login failure
    method: POST
    path: /login
    match:
      body: { password: wrong }
    status: 401
    body: { error: "Invalid email or password" }

  - name: login success
    method: POST
    path: /login
    latency: 400
    body:
      token: "{{faker.hex(40)}}"
      user: { email: "{{body.email}}", name: "{{faker.name}}" }

  - name: search
    method: GET
    path: /search
    body:
      query: "{{query.q | default('')}}"
      results:
        $repeat: "{{query.limit | default(5)}}"
        $item:
          id: "{{faker.uuid}}"
          title: "{{faker.sentence(5)}}"
          score: "{{faker.float(0, 1, 3)}}"

  - name: flaky endpoint
    method: GET
    path: /reports/{id}
    error_rate: 0.3
    error: { status: 500, body: { error: "report generation failed" } }
    body: { id: "{{params.id}}", status: ready, url: "https://example.com/reports/{{params.id}}.pdf" }

  - name: static file
    method: GET
    path: /config
    file: data/app-config.json

# Serve examples from an OpenAPI 3 document as well (routes above take precedence).
openapi: openapi.yaml

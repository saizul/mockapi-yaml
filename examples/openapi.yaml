openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    get:
      operationId: listOrders
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The order
          content:
            application/json:
              examples:
                paid:
                  value: { id: "{{params.orderId}}", status: paid, total: 49.9 }
                refunded:
                  value: { id: "{{params.orderId}}", status: refunded, total: 0 }
        "404":
          description: Not found
          content:
            application/json:
              example: { error: "order not found" }
components:
  schemas:
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, paid, shipped, refunded] }
        total: { type: number, example: 19.99 }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              sku: { type: string, example: SKU-1 }
              quantity: { type: integer, minimum: 1 }
